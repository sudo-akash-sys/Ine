<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage Experiment</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #222;
      color: #fff;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .nav {
      display: flex;
      gap: 20px;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
    }

    .main {
      flex: 1;
    }

    .hero {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 { margin-bottom: 10px; }

    .cards {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .card {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
    }

    .card h3 { margin-bottom: 10px; }

    .footer {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
      color: #fff;
    }

    @media (max-width: 768px) {
      .cards {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="header">
      <div class="logo">Company Name</div>
      <div class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <div class="main">
      <div class="hero">
        <h1>Welcome to Our Site</h1>
        <p>We build great things</p>
      </div>

      <div class="cards">
        <div class="card">
          <h3>Card 1</h3>
          <p>Desc 1</p>
        </div>
        <div class="card">
          <h3>Card 2</h3>
          <p>Desc 2</p>
        </div>
        <div class="card">
          <h3>Card 3</h3>
          <p>Desc 3</p>
        </div>
      </div>
    </div>

    <div class="footer">
      &copy; 2026 Company Name
    </div>
  </div>

</body>
</html>
